name: Manual Post to WordPress (同人作品 手動投稿)

on:
  workflow_dispatch:
    inputs:
      work_title:
        description: "【必須】作品名"
        required: true
      work_affiliate_url:
        description: "【必須】アフィリエイトリンク"
        required: true
      work_genres:
        description: "ジャンル（カンマ区切り 例: 学園,NTR,フルボイス）"
        required: false
        default: ""
      work_price:
        description: "価格（例: 880）"
        required: false
        default: ""
      work_maker:
        description: "サークル名／メーカー名"
        required: false
        default: ""
      work_actors:
        description: "出演者（カンマ区切り。無ければ空欄でOK）"
        required: false
        default: ""
      work_overview:
        description: "あらすじ・紹介文（段落を分けたい場合は空行を1行入れる）"
        required: false
        default: ""
      work_points:
        description: "ポイント一覧（改行またはカンマ区切り）"
        required: false
        default: ""
      work_package_image:
        description: "パッケージ画像URL（アイキャッチに使用）"
        required: false
        default: ""
      work_sample_images:
        description: "サンプル画像URL（改行またはカンマ区切り）"
        required: false
        default: ""
      work_content_id:
        description: "スラッグ生成用ID（英数字推奨。空欄なら自動生成）"
        required: false
        default: ""
      work_category_label:
        description: "投稿カテゴリー名"
        required: false
        default: "同人"
      wp_post_status:
        description: "投稿ステータス（draft / pending / publish）"
        required: false
        default: "draft"

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Post to WordPress (manual entry)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_POST_STATUS: ${{ github.event.inputs.wp_post_status }}
          WORK_TITLE: ${{ github.event.inputs.work_title }}
          WORK_AFFILIATE_URL: ${{ github.event.inputs.work_affiliate_url }}
          WORK_GENRES: ${{ github.event.inputs.work_genres }}
          WORK_PRICE: ${{ github.event.inputs.work_price }}
          WORK_MAKER: ${{ github.event.inputs.work_maker }}
          WORK_ACTORS: ${{ github.event.inputs.work_actors }}
          WORK_OVERVIEW: ${{ github.event.inputs.work_overview }}
          WORK_POINTS: ${{ github.event.inputs.work_points }}
          WORK_PACKAGE_IMAGE: ${{ github.event.inputs.work_package_image }}
          WORK_SAMPLE_IMAGES: ${{ github.event.inputs.work_sample_images }}
          WORK_CONTENT_ID: ${{ github.event.inputs.work_content_id }}
          WORK_CATEGORY_LABEL: ${{ github.event.inputs.work_category_label }}
        run: python scripts/wordpress_manual_poster.py
