name: 予約作品自動投稿

# 実行タイミング
#   ・毎日 日本時間 9:00（UTC 0:00）に自動実行
#   ・「Actions」タブから手動実行（workflow_dispatch）も可能
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  post-reserve-articles:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: 投稿済み履歴ファイル(予約作品用)を復元
        uses: actions/cache@v4
        with:
          path: outputs/posted_history_reserve.json
          key: posted-history-reserve-${{ github.run_id }}
          restore-keys: |
            posted-history-reserve-

      - name: 予約作品を投稿
        env:
          DMM_API_ID:          ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID:    ${{ secrets.DMM_AFFILIATE_ID }}
          WP_URL:              ${{ secrets.WP_URL }}
          WP_USERNAME:         ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:     ${{ secrets.WP_APP_PASSWORD }}
          CONTENT_TYPE:        av
          WP_POST_STATUS:      draft
          RESERVE_WINDOW_DAYS: '60'
          MAX_ARTICLES:        '5'
          FETCH_COUNT:         '100'
          RANK_FETCH_LIMIT:    '500'
          EXCLUDE_VR:          'true'
        run: python wordpress_reserve_poster.py

      - name: 投稿済み履歴ファイル(予約作品用)を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/posted_history_reserve.json
          key: posted-history-reserve-${{ github.run_id }}
